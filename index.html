<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Resident Run</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resident Run">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
/* Layout: one calm Fitness-style column. Large title, grouped lists, vivid rings on true black. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#E9E9EE; --seg-on:#FFFFFF; --sep:rgba(60,60,67,.16);
  --ink:#000000; --soft:rgba(60,60,67,.62); --glass:rgba(249,249,251,.74);
  --accent:#0A84FF; --danger:#FF3B30; --db:#EC0016;
  --r1:#00A3C4; --r2:#5FA800; --r3:#E3001B; --r4:#A62FE0; --r5:#E58A00;
  --round: ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --text: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono: ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --seg-on:#636366; --sep:rgba(84,84,88,.5);
    --ink:#FFFFFF; --soft:rgba(235,235,245,.6); --glass:rgba(28,28,30,.72);
    --r1:#2FE3FF; --r2:#C6FF3D; --r3:#FF3B4A; --r4:#C56CFF; --r5:#FFB224; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --seg-on:#636366; --sep:rgba(84,84,88,.5);
  --ink:#FFFFFF; --soft:rgba(235,235,245,.6); --glass:rgba(28,28,30,.72);
  --r1:#2FE3FF; --r2:#C6FF3D; --r3:#FF3B4A; --r4:#C56CFF; --r5:#FFB224; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:130px;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
main{max-width:600px;margin:0 auto;padding-top:14px;position:relative}
h1,h2,h3,p{margin:0}
h1{font-family:var(--round);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h3{font-family:var(--round);font-size:19px;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.eyebrow-s{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:26px 4px 8px}
.soft{color:var(--soft)} .small{font-size:14px}
.row{display:flex;gap:12px;align-items:center} .sp{justify-content:space-between} .wrap{flex-wrap:wrap}
.view{animation:rise .55s cubic-bezier(.2,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
header.lt{display:flex;flex-direction:column;gap:2px;padding:6px 4px 10px;position:relative}
header.lt .add{position:absolute;right:0;top:14px}

/* grouped lists */
.list{background:var(--card);border-radius:18px;overflow:hidden}
.item{padding:14px 16px;border-top:.5px solid var(--sep)}
.item:first-child{border-top:0}
.cap{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--accent)) 22%,transparent);overflow:hidden}
.cap>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));transition:width 1s cubic-bezier(.2,1,.3,1)}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--soft)}
.pill.hot{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}

/* buttons: springy */
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .2s}
button:active{transform:scale(.95)}
button:disabled{opacity:.35;cursor:not-allowed}
.cta{display:block;width:100%;min-height:54px;border-radius:16px;background:var(--accent);color:#fff;font-family:var(--round);font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:18px}
.tb{color:var(--accent);font-weight:600;font-size:16px;padding:8px 4px;min-height:40px;display:inline-flex;align-items:center;gap:4px}
.tb.danger{color:var(--danger)}
.acts{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
input,textarea{font:inherit;font-size:17px;width:100%;padding:13px 14px;border:0;border-radius:12px;background:var(--card2);color:var(--ink);outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.4}
input:focus,textarea:focus{box-shadow:0 0 0 2px var(--accent)}
label.fl{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:14px 2px 6px}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-weight:600;font-size:15px;color:var(--soft)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.ic{flex:none;display:inline-block;vertical-align:middle}

/* Today */
.hero{display:flex;gap:20px;align-items:center;padding:18px 16px}
.rings{flex:none;display:block}
.rp{transition:stroke-dashoffset 1.2s cubic-bezier(.2,1,.3,1)}
.rp.full{filter:drop-shadow(0 0 5px currentColor)}
.legend{flex:1;min-width:0;display:grid;gap:11px}
.lg .ln{font-family:var(--round);font-weight:700;font-size:14px;letter-spacing:.01em}
.lg .lv{font-family:var(--round);font-size:15px;color:var(--soft)}
.lg .lv b{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-right:2px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats>div{padding:14px 10px;text-align:left;border-left:.5px solid var(--sep)}
.stats>div:first-child{border-left:0}
.stats b{display:flex;align-items:center;gap:6px;font-family:var(--round);font-size:22px;font-weight:800}
.stats span{font-size:12px;color:var(--soft)}
.bars{display:flex;gap:8px;align-items:flex-end;height:88px;padding:14px 16px 0}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:11px;color:var(--soft)}
.bars i{display:block;width:100%;border-radius:6px;background:var(--r1);min-height:4px;opacity:.5}
.bars .td i{opacity:1}
.bars .td{color:var(--ink);font-weight:700}

/* Focus */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--card);font-weight:600;font-size:15px;box-shadow:inset 0 0 0 1.5px transparent;transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.chip.on{box-shadow:inset 0 0 0 2px var(--c)}
.focus{position:relative;text-align:center;padding-top:8px}
.wash{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 50% 18%,color-mix(in srgb,var(--wc) 30%,transparent),transparent 70%)}
.focus .topic{font-family:var(--round);font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 12px 0}
.bigring{position:relative;width:272px;height:272px;margin:22px auto 14px}
.bigring svg{display:block;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--wc) 55%,transparent))}
.bigclock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#clock{font-family:var(--round);font-size:66px;font-weight:800;letter-spacing:-.04em}
#line{font-size:14px;color:var(--soft);margin-top:2px;padding:0 34px;min-height:20px}

/* Wallet */
.passes{display:grid;gap:16px}
.pass{border-radius:20px;background:var(--card);overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14);position:relative}
.pass-top{padding:18px 18px 22px;color:#fff;position:relative;overflow:hidden}
.pass.common .pass-top{background:linear-gradient(135deg,#3A3A3C,#636366)}
.pass.rare .pass-top{background:linear-gradient(135deg,#0A84FF,#5E5CE6)}
.pass.legendary .pass-top{background:linear-gradient(135deg,#FFD60A,#FF9F0A 60%,#FF6B00);color:#2a1700}
.pass-kicker{font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.8}
.pass-top h3{font-size:26px;font-weight:800;margin:6px 0 10px;letter-spacing:-.02em}
.pass-state{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px}
.pass.legendary .pass-state{background:rgba(255,255,255,.4)}
.pass.locked .pass-top{filter:saturate(.3) brightness(.78)}
.pass.ready .pass-top::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{to{transform:translateX(120%)}}
.pass-cut{display:flex;align-items:center;margin:-1px 0;height:22px;background:var(--card)}
.pass-cut i{width:22px;height:22px;border-radius:50%;background:var(--bg);flex:none}
.pass-cut i:first-child{margin-left:-11px} .pass-cut i:last-child{margin-right:-11px}
.pass-cut span{flex:1;border-top:2px dashed var(--sep);margin:0 6px}
.pass-body{padding:6px 18px 18px}
.req{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--soft);padding:4px 0}
.req.ok{color:var(--ink)} .req.ok .ic{color:var(--r2)}
.req .o{width:16px;height:16px;border-radius:50%;border:2px solid var(--sep);flex:none}
.barcode{height:34px;margin:12px 0 2px;opacity:.8;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px,var(--ink) 13px 14px,transparent 14px 18px);-webkit-mask:linear-gradient(90deg,#000 70%,transparent);mask:linear-gradient(90deg,#000 70%,transparent)}
.pass.claimed{opacity:.6}
.fks{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.fks::-webkit-scrollbar{display:none}
.fk{flex:none;width:262px;scroll-snap-align:start;border-radius:16px;background:var(--card);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.fk-top{display:flex;justify-content:space-between;padding:9px 14px;background:var(--db);color:#fff;font-size:11px;font-weight:700;letter-spacing:.14em}
.fk:not(.got) .fk-top{background:var(--card2);color:var(--soft)}
.fk-route{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;color:var(--soft)}
.fk-route small{display:block;font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--soft)}
.fk-route b{display:block;font-family:var(--round);font-size:17px;color:var(--ink);line-height:1.15;margin-top:2px}
.fk:not(.got) .fk-route b{color:var(--soft)}
.fk-bot{display:flex;justify-content:space-between;padding:10px 14px;border-top:2px dashed var(--sep);font-size:13px;color:var(--soft)}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:16px 12px}
.medal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;font-weight:600;line-height:1.2}
.medal .m{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--mc) 70%,#fff),var(--mc) 60%,color-mix(in srgb,var(--mc) 70%,#000));box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),0 4px 12px color-mix(in srgb,var(--mc) 45%,transparent);transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.medal .m:active{transform:rotate(18deg) scale(1.08)}
.medal.off .m{background:var(--card2);box-shadow:none;color:var(--soft)}
.medal.off{color:var(--soft)}

/* reward drop + celebrate */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:26px 16px;margin-top:14px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--r4) 85%,#000),color-mix(in srgb,var(--r1) 80%,#000));color:#fff;font-family:var(--round)}
.drop b{font-size:20px} .drop small{opacity:.8;font-family:var(--text)}
.drop:not(.open) .drop-ic{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg) scale(1.08)}}
.drop.open{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.cel{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.cel-card{width:min(86vw,340px);text-align:center;padding:28px 22px 22px;border-radius:28px;background:var(--card);animation:spring .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes spring{from{transform:scale(.6);opacity:0}}
.cel-card .rings{margin:0 auto}
.cel-card h2{font-family:var(--round);font-size:28px;font-weight:800;letter-spacing:-.02em;margin:12px 0 6px}
.conf{position:fixed;top:-24px;z-index:90;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.3}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:100;max-width:92vw;padding:11px 18px;border-radius:99px;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 0 0 .5px var(--sep);font-weight:600;font-size:15px;text-align:center;animation:drop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes drop{from{transform:translate(-50%,-30px) scale(.9);opacity:0}}
.banner{padding:14px 16px;border-radius:14px;background:var(--card);margin:6px 0;font-size:15px}

/* tab bar: glass */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:0 -.5px 0 var(--sep)}
nav div{display:flex;max-width:600px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--soft)}
nav button.on{color:var(--accent)}

/* sheets */
dialog{border:0;color:var(--ink);background:var(--card);width:100%;max-width:560px;margin:auto auto 0;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh}
dialog[open]{animation:sheet .5s cubic-bezier(.2,1,.3,1)}
@keyframes sheet{from{transform:translateY(100%)}}
dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(5px)}
dialog::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 14px}
dialog h3{margin-bottom:6px}
dialog .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- Liquid Glass ---- */
:root{--lens:rgba(255,255,255,.85);--navbg:rgba(235,235,240,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lens:rgba(255,255,255,.17);--navbg:rgba(44,44,48,.42)}}
:root[data-theme="dark"]{--lens:rgba(255,255,255,.17);--navbg:rgba(44,44,48,.42)}
a.tb{text-decoration:none}
.dot{width:10px;height:10px;border-radius:50%;background:#30D158;box-shadow:0 0 8px #30D158;flex:none;margin-right:2px}
nav{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;padding:0 18px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav #nav{pointer-events:auto;position:relative;display:flex;max-width:400px;margin:0 auto;padding:5px;border-radius:99px;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background:var(--navbg);backdrop-filter:blur(22px) saturate(190%) brightness(1.08);-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.07),inset 0 0 0 .5px rgba(255,255,255,.2),0 12px 32px rgba(0,0,0,.38)}
nav #nav .lens{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:99px;background:var(--lens);
  backdrop-filter:blur(8px) saturate(230%) brightness(1.3);-webkit-backdrop-filter:blur(8px) saturate(230%) brightness(1.3);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.28),0 4px 16px rgba(0,0,0,.28);
  transition:transform .55s cubic-bezier(.3,1.5,.5,1);pointer-events:none;z-index:0}
nav #nav.drag .lens{transition:none}
nav #nav button{position:relative;z-index:1;padding:7px 0;transition:color .25s,transform .25s}
nav #nav button.pre{color:var(--accent);transform:scale(1.06)}
#app.enter{animation:pgin .5s cubic-bezier(.2,.9,.3,1)}
@keyframes pgin{from{opacity:0;transform:translateX(var(--dx,0)) scale(.985);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
dialog{background:var(--glass);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 -10px 40px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){nav #nav .lens{transition:none}#app.enter{animation:none}}
</style>
<style id="pwa">
/* only for the installed home-screen app; hosted pages get their own insets */
html{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>

<script src="app.js" defer></script>
</body>
</html>
